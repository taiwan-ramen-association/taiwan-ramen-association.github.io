  <style>
    .page-main { max-width: 1120px; }
    .page-title { margin-bottom: 12px; }
    .zone-desc { font-size: 15px; line-height: 2; color: var(--muted); margin-bottom: 32px; }
    .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .zone-card { position: relative; display: block; padding: 28px 24px 56px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); transition: border-color .15s; }
    @media (hover: hover) { .zone-card:hover { border-color: var(--ink); } }
    .zone-card-tag { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .zone-card-title { font-family: var(--serif); font-size: 20px; font-weight: 900; letter-spacing: .03em; margin-bottom: 8px; }
    .zone-card-desc { font-size: 14px; line-height: 1.9; color: var(--muted); }
    .zone-card .icon { position: absolute; right: 24px; bottom: 24px; color: var(--accent-text); }

  <script src="assets/js/icon-motion.js" defer></script>

<!-- 頁首：這裡是靜態備援（logo＋電腦版找拉麵）。完整選單由 assets/js/site-header.js 換上，要改選單請改那支檔案 -->

    <div class="zone-grid">
      <a class="zone-card" href="meetings.html">
        <p class="zone-card-tag">內部文件</p>
        <h2 class="zone-card-title">會議紀錄</h2>
        <p class="zone-card-desc">理監事會議、會員大會<br>等各類會議之紀錄彙整。</p>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-anim="arrow-right"><g><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g></svg>
      </a>
      <a class="zone-card" href="charter.html">
        <p class="zone-card-tag">法規文件</p>
        <h2 class="zone-card-title">協會章程</h2>
        <p class="zone-card-desc">台灣拉麵協會組織章程<br>及相關規範條文。</p>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-anim="arrow-right"><g><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g></svg>
      </a>
    </div>
  </main>
</div>

<!-- 頁尾：由 assets/js/site-header.js 產生 -->
<div data-site-footer></div>
