<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D5PB53XF7P"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-D5PB53XF7P');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- AdSense 帳戶 2026-11 因閒置停用，所以不載廣告程式。這行 meta 是 Google 驗證網站用的，保留；
       重新啟用後在這行下面加回：<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6476285123291834" crossorigin="anonymous"></script>
       （待辦與步驟見 notes MANUAL §十七「AdSense 帳戶已停用」） -->
  <meta name="google-adsense-account" content="ca-pub-6476285123291834">
  <title>合作夥伴 | 台灣拉麵協會</title>
  <link rel="canonical" href="https://www.taiwanramen.org/partners.html">
  <meta property="og:site_name" content="台灣拉麵協會">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .page-main { max-width: 960px; }
    .partners-section { margin-bottom: 48px; }
    .partners-section-header { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 16px; }
    .partners-section-header.is-member { border-bottom-color: var(--accent); }
    .partners-section-num { font-size: 13px; font-weight: 700; color: var(--accent-text); font-variant-numeric: tabular-nums; }
    .partners-section-title { font-family: var(--serif); font-size: 20px; font-weight: 900; letter-spacing: .03em; }
    .partners-section-desc { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 16px; }

    .partners-grid { display: grid; gap: 16px; }
    .partners-grid-4 { grid-template-columns: repeat(4, 1fr); }
    .partners-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .partner-card { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; padding: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s; }
    .partner-card.is-member { border: 2px solid var(--accent); }
    .partner-card a { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    @media (hover: hover) { .partner-card.has-link:hover { border-color: var(--ink); } }
    .partner-card img { max-height: 80px; max-width: 100%; width: auto; object-fit: contain; }
    .member-badge { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; color: var(--on-accent);
      background: var(--accent); border-radius: 4px; padding: 1px 6px; }

    @media (max-width: 768px) {
      .partners-grid-4, .partners-grid-3 { grid-template-columns: repeat(2, 1fr); }
      .partners-grid { gap: 12px; }
    }
  </style>
  <script src="assets/js/site-header.js" defer></script>
  <script src="assets/js/icon-motion.js" defer></script>
</head>
<body>
<!-- 頁首：這裡是靜態備援（logo＋電腦版找拉麵）。完整選單由 assets/js/site-header.js 換上，要改選單請改那支檔案 -->
<header class="site-header" data-site-header>
  <a href="./" class="logo" aria-label="台灣拉麵協會 首頁"><img src="assets/img/logo-h.svg" alt="台灣拉麵協會 Taiwan Ramen Association" width="153" height="32"></a>
  <div class="header-right"><a href="/finder.html" class="btn btn-primary btn-sm">找拉麵</a></div>
</header>

<div class="page-body">
  <main class="page-main">
    <h1 class="page-title">合作夥伴</h1>
    <p class="status" id="status">載入中…</p>
    <div id="partners-body"></div>
  </main>
</div>

<!-- 頁尾：由 assets/js/site-header.js 產生 -->
<div data-site-footer></div>

<script>
  var CATEGORIES = [
    { key: 'member', label: '協會會員店家', desc: '已正式加入台灣拉麵協會之會員店家。', isMember: true },
    { key: 'ramen', label: '合作拉麵店', desc: '與協會有合作關係之拉麵店家。', isMember: false },
    { key: 'partner', label: '合作商家', desc: '與協會有合作關係之在地商家與企業。', isMember: false }
  ];
  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  fetch('/data/partners.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById('status').remove();
      var body = document.getElementById('partners-body');
      var groups = {};
      data.forEach(function (p) { (groups[p.category] = groups[p.category] || []).push(p); });

      var shown = 0;
      CATEGORIES.forEach(function (cat) {
        var items = groups[cat.key];
        if (!items || !items.length) return;
        shown++;
        var sec = node('section', 'partners-section');
        var head = node('div', 'partners-section-header' + (cat.isMember ? ' is-member' : ''));
        head.appendChild(node('span', 'partners-section-num', (shown < 10 ? '0' : '') + shown));
        head.appendChild(node('h2', 'partners-section-title', cat.label));
        sec.appendChild(head);
        sec.appendChild(node('p', 'partners-section-desc', cat.desc));
        var grid = node('div', 'partners-grid ' + (items.length <= 3 ? 'partners-grid-3' : 'partners-grid-4'));
        items.forEach(function (p) {
          var card = node('div', 'partner-card' + (cat.isMember ? ' is-member' : '') + (p.url ? ' has-link' : ''));
          if (cat.isMember) card.appendChild(node('span', 'member-badge', '會員'));
          var img = node('img');
          img.src = p.logo;           // 相對路徑：assets/icons/ 放的是 240px 縮圖
          img.alt = p.name;
          img.loading = 'lazy';
          img.decoding = 'async';
          if (p.url) {
            var a = node('a');
            a.href = p.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.appendChild(img);
            card.appendChild(a);
          } else {
            card.appendChild(img);
          }
          grid.appendChild(card);
        });
        sec.appendChild(grid);
        body.appendChild(sec);
      });
    })
    .catch(function () {
      document.getElementById('status').textContent = '載入失敗，請稍後再試。';
    });
</script>
</body>
</html>
