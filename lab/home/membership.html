<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ▼ 測試站專用（上線時刪掉這一段）：不讓搜尋引擎收錄。GA4、AdSense 測試站不載，上線時照正式版加回 -->
  <meta name="robots" content="noindex, nofollow">
  <!-- ▲ 測試站專用 -->
  <title>加入會員 | 台灣拉麵協會</title>
  <link rel="canonical" href="https://www.taiwanramen.org/membership.html">
  <meta property="og:site_name" content="台灣拉麵協會">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .page-main { max-width: 960px; }
    .page-title { margin-bottom: 16px; }
    .page-intro { margin-bottom: 32px; }

    .feature-notice { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 40px; font-size: 14px; line-height: 1.8; color: var(--muted); }
    .feature-notice .icon { color: var(--accent-text); margin-top: 3px; }

    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 40px; }
    .tier-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px; display: flex; flex-direction: column; }
    .tier-card.featured { background: var(--ink); border-color: var(--ink); color: var(--white); }
    .tier-name { font-family: var(--serif); font-size: 24px; font-weight: 900; letter-spacing: .03em; margin-bottom: 6px; }
    .tier-fee { margin-bottom: 16px; font-size: 14px; font-weight: 500; color: var(--accent-text); }
    .tier-card.featured .tier-fee { color: #F1A7AA; }
    .tier-desc { font-size: 14px; line-height: 1.9; color: var(--muted); margin-bottom: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
    .tier-card.featured .tier-desc { color: rgba(255,255,255,.62); border-top-color: rgba(255,255,255,.14); }
    .tier-features { list-style: none; margin-bottom: 20px; }
    .tier-features li { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .tier-card.featured .tier-features li { border-bottom-color: rgba(255,255,255,.14); color: rgba(255,255,255,.8); }
    .tier-features li::before { content: '✓ '; color: var(--accent-text); }
    .tier-card.featured .tier-features li::before { color: #F1A7AA; }
    .tier-card .btn { align-self: flex-start; margin-top: auto; }
    .tier-card.featured .btn-secondary { background: transparent; color: var(--white); border-color: rgba(255,255,255,.4); }
    @media (hover: hover) { .tier-card.featured .btn-secondary:hover { border-color: var(--white); } }

    .apply-section { max-width: 960px; margin: 0 auto 56px; padding: 0 20px; }
    .apply-box { background: var(--ink); color: var(--white); border-radius: var(--radius); padding: 32px 24px; }
    .apply-title { font-family: var(--serif); font-size: 22px; font-weight: 900; letter-spacing: .03em; margin-bottom: 12px; }
    .apply-note { font-size: 14px; line-height: 1.9; color: rgba(255,255,255,.62); max-width: 560px; margin-bottom: 24px; }

    @media (max-width: 700px) { .tier-grid { grid-template-columns: 1fr; } }
    @media (min-width: 760px) {
      .apply-section { padding: 0 40px; margin-bottom: 80px; }
      .apply-box { padding: 48px; }
    }
  </style>
  <script src="assets/js/site-header.js" defer></script>
  <script src="assets/js/icon-motion.js" defer></script>
</head>
<body>
<!-- 頁首：這裡是靜態備援（logo＋電腦版找拉麵）。完整選單由 assets/js/site-header.js 換上，要改選單請改那支檔案 -->
<header class="site-header" data-site-header>
  <a href="./" class="logo" aria-label="台灣拉麵協會 首頁"><img src="assets/img/logo-h.svg" alt="台灣拉麵協會 Taiwan Ramen Association" width="153" height="32"></a>
  <div class="header-right"><a href="/finder.html" class="btn btn-primary btn-sm">找拉麵</a></div>
</header>

<div class="page-body">
  <main class="page-main">
    <h1 class="page-title">加入會員</h1>
    <p class="page-intro" id="page-intro"></p>

    <div class="feature-notice">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>會員將享有數位平台專屬功能，包括即時店家資訊、排隊人數等進階服務（開發中，敬請期待）。非會員可免費使用基本拉麵搜尋器。</span>
    </div>

    <div class="tier-grid" id="tier-grid"></div>
  </main>

  <section class="apply-section">
    <div class="apply-box">
      <h2 class="apply-title">申請入會</h2>
      <p class="apply-note" id="apply-note"></p>
      <a href="mailto:taiwan.ramen.association@gmail.com" class="btn btn-primary">來信申請</a>
    </div>
  </section>
</div>

<!-- 頁尾：由 assets/js/site-header.js 產生 -->
<div data-site-footer></div>

<script>
  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  fetch('/data/membership.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById('page-intro').textContent = data.intro;
      document.getElementById('apply-note').textContent = data.apply_note;
      var grid = document.getElementById('tier-grid');
      data.tiers.forEach(function (tier) {
        var card = node('div', 'tier-card' + (tier.featured ? ' featured' : ''));
        card.appendChild(node('h2', 'tier-name', tier.name));
        card.appendChild(node('p', 'tier-fee', tier.entry_fee !== null
          ? '入會費 NT$' + tier.entry_fee.toLocaleString() + ' ／ 常年費 NT$' + tier.annual_fee.toLocaleString()
          : '免繳會費'));
        var desc = node('div', 'tier-desc');
        desc.innerHTML = tier.description; // 來自 repo 的 data/membership.json，照舊
        card.appendChild(desc);
        var ul = node('ul', 'tier-features');
        tier.features.forEach(function (f) { ul.appendChild(node('li', null, f)); });
        card.appendChild(ul);
        if (tier.apply_url) {
          var a = node('a', 'btn btn-secondary btn-sm', '入會申請書');
          a.href = tier.apply_url;
          a.target = '_blank';
          a.rel = 'noopener';
          card.appendChild(a);
        }
        grid.appendChild(card);
      });
    });
</script>
</body>
</html>
