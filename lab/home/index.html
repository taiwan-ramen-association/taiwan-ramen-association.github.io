  <style>
    /* ── 首頁專用（共用的按鈕、頁首、頁尾在 site.css） ── */
    .sec { padding: 40px 20px; }
    .band { background: var(--band); }
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
    .sec-title { font-family: var(--serif); font-weight: 900; font-size: 24px; line-height: 1.35; letter-spacing: .03em; }
    .link-more { flex: none; color: var(--accent-text); font-size: 14px; font-weight: 500; white-space: nowrap;
      text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 4px; transition: text-decoration-color .15s; }
    @media (hover: hover) { .link-more:hover { text-decoration-color: currentColor; } }

    /* 橫向滑動列（手機）→ 格線（電腦） */
    /* scroll-padding 要跟左右 padding 一樣：沒有它，吸附點會對齊捲動區邊緣，載入時第一張卡就被捲到貼齊螢幕左緣 */
    .shelf { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; margin: 0 -20px; padding: 2px 20px 6px; scrollbar-width: none; }
    .shelf::-webkit-scrollbar { display: none; }
    .shelf > * { flex: 0 0 62%; scroll-snap-align: start; }

    /* ① 找拉麵 */
    .hero { position: relative; padding: 32px 20px 36px; overflow: hidden; border-bottom: 1px solid var(--line); }
    .hero-mark { position: absolute; right: -36px; top: 8px; width: 200px; height: 200px; color: var(--accent-text); opacity: .07; stroke-width: 1.2; pointer-events: none; }
    .hero-inner { position: relative; max-width: 640px; }
    .hero h1 { font-family: var(--serif); font-weight: 900; font-size: 34px; line-height: 1.3; letter-spacing: .04em; }
    .hero-sub { margin-top: 10px; font-size: 15px; line-height: 1.8; color: var(--muted); }
    .search { display: flex; align-items: center; gap: 8px; margin-top: 22px; padding: 0 6px 0 14px; height: 54px;
      background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .search:focus-within { border-color: var(--ink); }
    .search > .icon { color: var(--muted); }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 400 16px var(--sans); color: var(--ink); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search .btn { height: 40px; padding: 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .chip { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); font-size: 13px; color: var(--ink); transition: border-color .15s, color .15s; }
    .chip::before { content: '#'; color: var(--stone); margin-right: 2px; }
    @media (hover: hover) { .chip:hover { border-color: var(--accent-text); color: var(--accent-text); } }
    .hero-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 18px; min-height: 23px; font-size: 13px; color: var(--muted); }
    .hero-stats[data-state="wait"] { visibility: hidden; }
    .hero-stats b { color: var(--ink); font-weight: 700; font-size: 15px; margin: 0 2px; }
    .hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .hero-aside { display: none; }

    /* 圖片卡（精選、懶人包共用） */
    .tile { position: relative; display: block; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; background: var(--line); }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile.has-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%); }
    .tile-body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 12px 14px; color: var(--ink); }
    .tile.has-img .tile-body { color: var(--white); }
    .tile-body h3 { font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.35; }
    .tile-body p { font-size: 12px; opacity: .9; margin-top: 2px; }
    .tile-pill { position: absolute; top: 10px; left: 10px; z-index: 1; height: 24px; display: inline-flex; align-items: center; padding: 0 9px;
      border-radius: 6px; background: var(--white); color: var(--accent-text); font-size: 12px; font-weight: 700; }
    .tile.is-wait { background: var(--band); }

    /* ② 最新動態 */
    .follow-row { display: flex; flex-wrap: wrap; gap: 10px; }

    /* ③ 新開幕與即將開幕 */
    .shop-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); min-height: 168px; transition: border-color .15s; }
    @media (hover: hover) { a.shop-card:hover { border-color: var(--ink); } }
    .shop-card.is-wait { background: var(--band); border-color: var(--band); }
    .open-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 6px;
      background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 700; }
    .open-chip.upcoming { background: var(--prep-bg); color: var(--prep-txt); }
    .open-chip .icon { width: 13px; height: 13px; }
    .shop-name { font-size: 15px; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .shop-loc { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
    .shop-loc .icon { width: 14px; height: 14px; }
    .shop-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
    .shop-note { font-size: 12px; color: var(--muted); }
    .shop-more { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--accent-text);
      font-weight: 700; font-size: 14px; background: var(--accent-soft); border: 1px dashed var(--accent-text); border-radius: var(--radius);
      min-height: 168px; text-align: center; padding: 14px; }
    .shop-more .icon { width: 28px; height: 28px; }

    /* ④ 主題懶人包 */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tiles .tile:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }

    /* ⑤ 協會公告 */
    .notice-list { list-style: none; border-top: 1px solid var(--line); }
    .notice-list a, .notice-list .notice-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .notice-date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .notice-title { font-size: 14px; line-height: 1.6; }
    .notice-title .tag { margin-right: 6px; height: 20px; font-size: 11px; }
    .notice-list .icon { color: var(--stone); width: 16px; height: 16px; }
    .notice-msg { padding: 14px 0; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }

    /* ⑥ 關於協會、合作夥伴 */
    .about { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .about-text { font-size: 15px; line-height: 1.9; color: var(--muted); margin-top: 12px; }
    .about-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .partner-strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 14px -20px 12px; padding: 8px 20px 6px; min-height: 98px; }
    .partner-strip::-webkit-scrollbar { display: none; }
    .partner { position: relative; flex: 0 0 84px; height: 84px; display: flex; align-items: center; justify-content: center; padding: 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .partner img { max-height: 58px; width: auto; object-fit: contain; }
    .partner.member { border-color: var(--accent); }
    .partner.member::after { content: '會員'; position: absolute; top: -8px; right: -4px; font-size: 10px; font-weight: 700; color: var(--on-accent);
      background: var(--accent); border-radius: 4px; padding: 1px 5px; }

    @media (min-width: 760px) {
      .sec, .hero { padding-left: max(40px, calc((100% - 1120px) / 2)); padding-right: max(40px, calc((100% - 1120px) / 2)); }
      .sec { padding-top: 64px; padding-bottom: 64px; }
      .sec-title { font-size: 30px; }
      .hero { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 56px; align-items: center; padding-top: 72px; padding-bottom: 64px; }
      .hero.no-aside { grid-template-columns: minmax(0, 1fr); }
      .hero h1 { font-size: 48px; }
      .hero-mark { display: none; }
      .hero-actions { display: flex; }
      .hero-aside { display: block; }
      .hero.no-aside .hero-aside { display: none; }
      .hero-aside .tile { aspect-ratio: 4 / 5; }
      .shelf { display: grid; overflow: visible; margin: 0; padding: 0; }
      .shelf > * { flex: none; }
      .shop-shelf { grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .tiles { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .tiles .tile, .tiles .tile:first-child { grid-column: auto; aspect-ratio: 16 / 9; }
      .tiles .is-featured { display: none; }
      #collections.only-featured { display: none; } /* 沒有懶人包、只有精選：電腦版精選已在主視覺右側 */
      .about { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; align-items: start; }
      .partner-strip { flex-wrap: wrap; overflow: visible; margin: 14px 0 12px; padding: 8px 0 0; }
    }
  </style>
  <script src="assets/js/site-header.js" defer></script>
  <script src="assets/js/icon-motion.js" defer></script>
  <script src="assets/js/home.js" defer></script>
</head>
