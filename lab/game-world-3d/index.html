<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拉麵養成世界 3D</title>
<style>
  :root {
    --bg: #16181d;
    --panel: rgba(22, 24, 29, 0.86);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e8e4da;
    --muted: #9a958a;
    --accent: #d64541;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 12px; max-width: min(460px, calc(100% - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    backdrop-filter: blur(6px); }
  #hud h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
  #hud .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #hud .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  #hud button, #hud a.btn { font: inherit; font-size: 12px; color: var(--text); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; text-decoration: none; }
  #hud button:hover, #hud a.btn:hover { border-color: var(--accent); }
  #hud .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #debug { margin-top: 6px; font: 11px/1.4 ui-monospace, Consolas, monospace; color: #8fd18f; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; font-size: 13px; white-space: nowrap; z-index: 5; }
  #attr { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted);
    background: var(--panel); border-radius: 4px; padding: 1px 6px; }
  #attr a { color: inherit; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.6); z-index: 10; }
  #err[hidden] { display: none; }
  #err .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; max-width: 520px; }
  #err .box p { margin: 6px 0 0; color: var(--muted); }
  @media (max-width: 520px) {
    #hud { top: 8px; left: 8px; padding: 8px 10px; }
    #hud .hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <h1 id="title">載入中…</h1>
  <div class="meta" id="meta"></div>
  <div class="row">
    <button data-view="overview">俯瞰</button>
    <button data-view="oblique">斜視</button>
    <button data-view="top">正上方</button>
    <a class="btn" id="to2d" href="../game-world/index.html">2D 版</a>
  </div>
  <div class="hint">左鍵拖曳旋轉 · 右鍵平移 · 滾輪縮放 · 點店家標記移過去</div>
  <div id="debug" hidden></div>
</div>

<div id="tip" hidden></div>

<div id="err" hidden>
  <div class="box">
    <strong>棋盤載入失敗</strong>
    <p>請用本機伺服器開啟（例如在 repo 根目錄執行 <code>python -m http.server 8000 --bind 127.0.0.1</code>），直接雙擊 HTML 讀不到棋盤檔。</p>
    <p id="errDetail"></p>
  </div>
</div>

<div id="attr">地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · three.js r186</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
