<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/icons/03.png">
<title>會員管理 ─ 台灣拉麵協會</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', -apple-system, sans-serif;
    background: #faf7f2; color: #1a1209; min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  #gate {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px;
  }
  #gate p { color: #8a7d6e; font-size: 14px; }
  .btn-google {
    display: flex; align-items: center; gap: 8px;
    background: #ffffff; border: 1px solid #e8e0d4;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; cursor: pointer; color: #1a1209;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-family: inherit;
  }
  .btn-google:hover { background: #fdf5f5; }
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div id="gate">
  <p id="gateMsg">驗證中…</p>
  <button class="btn-google" id="loginBtn" style="display:none">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.7 0 6.8 5.4 3 13.3l7.8 6C12.7 13.2 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 6.9-10.1 6.9-17z"/><path fill="#FBBC05" d="M10.8 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.7-4.7L2.4 13.3A23.9 23.9 0 0 0 0 24c0 3.8.9 7.4 2.4 10.6l8.4-5.9z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.3-3.7-13.2-9l-7.8 6C6.8 42.6 14.7 48 24 48z"/></svg>
    以 Google 帳號登入
  </button>
</div>

<script>
// ── L1：Firebase SDK 未載入（gstatic.com 被擋）─────────────────────────────
if (typeof firebase === 'undefined') {
  location.replace('console.html');
}

const firebaseConfig = {
  apiKey: "AIzaSyBdN0AYZMM2AU66QcH4BVNJHx1plwQBBYc",
  authDomain: "taiwan-ramen-association.firebaseapp.com",
  projectId: "taiwan-ramen-association",
  storageBucket: "taiwan-ramen-association.firebasestorage.app",
  messagingSenderId: "66234065738",
  appId: "1:66234065738:web:eb9fc4348a942da66ad7b3"
};
firebase.initializeApp(firebaseConfig);
const _auth     = firebase.auth();
const _db       = firebase.firestore();
const _storage  = firebase.storage();
const _provider = new firebase.auth.GoogleAuthProvider();

const gate     = document.getElementById('gate');
const gateMsg  = document.getElementById('gateMsg');
const loginBtn = document.getElementById('loginBtn');

// ── 共用：切換備用入口（短暫顯示訊息後跳轉）──────────────────────────────
function goConsole(reason) {
  gate.style.display = 'flex';
  loginBtn.style.display = 'none';
  gateMsg.textContent = `無法連線，切換備用入口… (${reason})`;
  setTimeout(() => location.replace('console.html'), 1500);
}

// ── L2：Auth 逾時保護（8 秒內 onAuthStateChanged 未觸發）─────────────────
const _authTimeout = setTimeout(() => goConsole('L2 auth timeout'), 8000);

function _adminHelperAuth() {
  const chName    = 'firebase-admin-auth-' + Date.now();
  const helperUrl = 'auth-helper.html?ch=' + encodeURIComponent(chName);
  const popup     = window.open(helperUrl, 'authHelper', 'width=500,height=650');
  if (!popup || popup.closed) {
    gateMsg.textContent = '無法開啟登入視窗，請使用 Safari 瀏覽器開啟此頁面';
    return;
  }
  const bc = new BroadcastChannel(chName);
  bc.onmessage = e => {
    bc.close();
    if (e.data?.type === 'AUTH_RESULT') {
      const cred = firebase.auth.GoogleAuthProvider.credential(e.data.idToken, e.data.accessToken);
      _auth.signInWithCredential(cred).catch(err => {
        gateMsg.textContent = '登入失敗：' + err.message;
      });
    } else if (e.data?.type === 'AUTH_ERROR') {
      gateMsg.textContent = '登入失敗，請重試';
    }
  };
  window.addEventListener('message', function onMsg(e) {
    if (e.origin !== location.origin) return;
    if (e.data?.type === 'AUTH_RESULT' || e.data?.type === 'AUTH_ERROR') {
      window.removeEventListener('message', onMsg);
      bc.close();
      if (e.data.type === 'AUTH_RESULT') {
        const cred = firebase.auth.GoogleAuthProvider.credential(e.data.idToken, e.data.accessToken);
        _auth.signInWithCredential(cred).catch(err => { gateMsg.textContent = '登入失敗：' + err.message; });
      }
    }
  });
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const isIOSPWA = /iPhone|iPad|iPod/.test(navigator.userAgent) && window.navigator.standalone === true;
  if (isIOSPWA) { _adminHelperAuth(); return; }
  _auth.signInWithPopup(_provider).catch(err => {
    if (err.code === 'auth/popup-blocked') _adminHelperAuth();
    else if (err.code !== 'auth/popup-closed-by-user') console.error(err);
  });
});

// getRedirectResult：僅在非 iOS PWA 環境下有意義（不 signOut 避免誤踢用戶）
_auth.getRedirectResult().catch(err => {
  if (err.code && err.code !== 'auth/no-auth-event') console.error('redirect 結果處理失敗', err);
});

_auth.onAuthStateChanged(async user => {
  clearTimeout(_authTimeout); // L2 解除

  if (!user) {
    gateMsg.textContent = '請以管理員 Google 帳號登入';
    loginBtn.style.display = 'flex';
    gate.style.display = 'flex';
    return;
  }

  loginBtn.style.display = 'none';
  gateMsg.textContent = '驗證中…';

  const snap = await _db.collection('users').doc(user.uid).get();
  const data  = snap.data();

  if (!data || data.role !== 'admin') {
    gateMsg.textContent = `⛔ 權限不足（${user.email}）`;
    gate.style.display = 'flex';
    return;
  }

  // ── L3：Storage getDownloadURL 或 bundle 注入失敗（含 5 秒逾時）─────────
  gateMsg.textContent = '載入管理介面…';
  const _l3Timeout = setTimeout(() => goConsole('L3 timeout'), 5000);
  try {
    const url    = await _storage.ref('admin/bundle.js').getDownloadURL();
    const script = document.createElement('script');
    script.src   = url;
    script.onload  = () => { clearTimeout(_l3Timeout); gate.style.display = 'none'; };
    script.onerror = () => { clearTimeout(_l3Timeout); goConsole('L3 script load'); };
    document.head.appendChild(script);
  } catch (e) {
    clearTimeout(_l3Timeout);
    goConsole('L3 storage');
  }
});
</script>
</body>
</html>
