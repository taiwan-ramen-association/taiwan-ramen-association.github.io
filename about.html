<html lang="zh-TW">
<head>

       重新啟用後在這行下面加回：<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6476285123291834" crossorigin="anonymous"></script>
       （待辦與步驟見 notes MANUAL §十七「AdSense 帳戶已停用」） -->
  <meta name="google-adsense-account" content="ca-pub-6476285123291834">
  <title>關於協會 | 台灣拉麵協會</title>
  <link rel="canonical" href="https://www.taiwanramen.org/about.html">
  <meta property="og:site_name" content="台灣拉麵協會">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .a-sec { padding: 32px 0; border-top: 1px solid var(--line); }
    .a-sec:first-child { border-top: 0; padding-top: 0; }
    .a-title { font-family: var(--serif); font-weight: 900; font-size: 24px; line-height: 1.35; letter-spacing: .03em; }
    .a-sec p { font-size: 15px; line-height: 2; color: var(--muted); margin-top: 12px; }
    .charter-btn { margin-top: 8px; }

    .contact { max-width: 860px; margin: 0 auto; padding: 0 20px 56px; }
    .contact-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .contact-head { padding: 24px 20px 8px; }
    .contact-head h2 { font-family: var(--serif); font-weight: 900; font-size: 24px; letter-spacing: .03em; }
    .contact-cells { display: grid; grid-template-columns: minmax(0, 1fr); }
    .cell { display: flex; flex-direction: column; gap: 4px; padding: 14px 20px; border-top: 1px solid var(--line); min-width: 0; }
    .cell-label { font-size: 13px; font-weight: 500; color: var(--muted); }
    .cell-value { font-size: 15px; font-weight: 500; line-height: 1.6; overflow-wrap: anywhere; }
    a.cell-value { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: text-decoration-color .15s; }
    @media (hover: hover) { a.cell-value:hover { text-decoration-color: var(--ink); } }
    .social-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

    @media (min-width: 760px) {
      .a-sec { padding: 44px 0; }
      .a-title { font-size: 28px; }
      .contact { padding: 0 40px 80px; }
      .contact-head { padding: 32px 36px 12px; }
      .contact-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cell { padding: 18px 36px; }
      .cell:nth-child(odd) { border-right: 1px solid var(--line); }
    }
  </style>
  <script src="assets/js/site-header.js" defer></script>
  <script src="assets/js/icon-motion.js" defer></script>
</head>
<body>
<!-- 頁首：這裡是靜態備援（logo＋電腦版找拉麵）。完整選單由 assets/js/site-header.js 換上，要改選單請改那支檔案 -->
<header class="site-header" data-site-header>
  <a href="./" class="logo" aria-label="台灣拉麵協會 首頁"><img src="assets/img/logo-h.svg" alt="台灣拉麵協會 Taiwan Ramen Association" width="153" height="32"></a>
  <div class="header-right"><a href="/finder.html" class="btn btn-primary btn-sm">找拉麵</a></div>
</header>

<div class="page-body">
  <main class="page-main">
    <h1 class="page-title">關於協會</h1>
    <div id="sections"></div>
    <a href="charter.html" class="btn btn-secondary charter-btn">查看協會章程</a>
  </main>

  <section class="contact" id="contact-block" hidden>
    <div class="contact-card">
      <div class="contact-head"><h2>聯絡我們</h2></div>
      <div class="contact-cells" id="contact-cells"></div>
    </div>
  </section>
</div>

<!-- 頁尾：由 assets/js/site-header.js 產生 -->
<div data-site-footer></div>

<script>
  // 社群按鈕的圖示會在電腦滑鼠移入時動（icon-motion.js）；形狀 PulsoIcon（ISC），授權見 assets/icons/PulsoIcon-LICENSE.txt
  var SOCIAL_ICONS = {
    Instagram: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-anim="brand-instagram"><g><rect x="2" y="2" width="20" height="20" rx="5"/></g><g><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></g><g><path d="M17.5 6.5h.01"/></g></svg>',
    Threads: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-anim="brand-threads"><g><path d="M17.5 7C16.3 5 14.4 4 12 4 7.6 4 5 7.5 5 12s2.6 8 7 8c3.6 0 6.5-2.3 6.5-5.5 0-2.8-2-4.5-5-4.5-2.2 0-3.8 1-3.8 2.6 0 1.4 1.1 2.4 2.6 2.4 2.4 0 3.5-2 3.4-5.5"/></g></svg>',
    Facebook: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" data-anim="brand-facebook"><g><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></g></svg>'
  };

  function cell(label, valueNode) {
    var c = document.createElement('div');
    c.className = 'cell';
    var l = document.createElement('span');
    l.className = 'cell-label';
    l.textContent = label;
    c.appendChild(l);
    c.appendChild(valueNode);
    return c;
  }
  function textValue(tag, text, href) {
    var n = document.createElement(tag);
    n.className = 'cell-value';
    n.textContent = text;
    if (href) n.href = href;
    return n;
  }

  fetch('/data/about.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var container = document.getElementById('sections');
      data.sections.forEach(function (sec) {
        var div = document.createElement('section');
        div.className = 'a-sec';
        var h = document.createElement('h2');
        h.className = 'a-title';
        h.textContent = sec.title;
        div.appendChild(h);
        sec.paragraphs.forEach(function (p) {
          var el = document.createElement('p');
          el.innerHTML = p; // 內文來自 repo 的 data/about.json（可能含連結），照舊用 innerHTML
          div.appendChild(el);
        });
        container.appendChild(div);
      });

      var c = data.contact;
      var cells = document.getElementById('contact-cells');
      cells.appendChild(cell('地址', textValue('span', c.address)));
      cells.appendChild(cell('電話', textValue('a', c.phone, 'tel:' + c.phone)));
      cells.appendChild(cell('電子郵件', textValue('a', c.email, 'mailto:' + c.email)));
      var links = document.createElement('div');
      links.className = 'social-links';
      c.social.forEach(function (s) {
        var a = document.createElement('a');
        a.className = 'btn btn-secondary btn-sm';
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = SOCIAL_ICONS[s.platform] || '';
        a.appendChild(document.createTextNode(s.platform));
        a.setAttribute('aria-label', s.platform + ' ' + s.handle);
        links.appendChild(a);
      });
      cells.appendChild(cell('社群', links));
      document.getElementById('contact-block').hidden = false;
    });
</script>
</body>
</html>
